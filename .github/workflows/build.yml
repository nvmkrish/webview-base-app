name: Build Signed Android WebView APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: Website URL
        required: true
      app_name:
        description: App Name
        required: true
      splash_color:
        description: Splash Color
        required: false
      splash_logo_url:
        description: Splash Logo URL
        required: false
      enable_push:
        description: Enable Push Notifications
        required: false
      enable_bottom_nav:
        description: Enable Bottom Navigation
        required: false
      enable_camera:
        description: Enable Camera Access
        required: false
      enable_location:
        description: Enable Location Access
        required: false
      enable_share:
        description: Enable Share Button
        required: false
      nav_items_json:
        description: Navigation Items JSON
        required: false
      app_id:
        description: App ID
        required: false
      backend_url:
        description: Backend URL
        required: false
      fcm_project_id:
        description: FCM Project ID
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks

    - name: Generate google-services.json
      if: ${{ github.event.inputs.fcm_project_id != '' }}
      run: |
        cat <<EOF > app/google-services.json
        {
          "project_info": {
            "project_number": "123456789",
            "project_id": "${{ github.event.inputs.fcm_project_id }}"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:123456789",
                "android_client_info": {
                  "package_name": "com.easyway.app"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "${{ secrets.FCM_API_KEY }}"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Replace App Name
      run: |
        sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.app_name }}</string>|g' app/src/main/res/values/strings.xml

    - name: Verify launcher icons
      run: |
        echo Checking_launcher_icons
        find app/src/main/res -name ic_launcher*

        
    - name: Grant Gradle Permission
      run: chmod +x gradlew
    
    - name: Build SIGNED Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        ./gradlew clean assembleRelease

    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: WebView Build v1.0.${{ github.run_number }}
        files: |
          app/build/outputs/apk/release/*.apk

